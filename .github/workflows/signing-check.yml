name: Check update signing key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the signing secret without logging key material
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const key = crypto.createPrivateKey(process.env.UPDATE_SIGNING_KEY);
          const publicKey = crypto.createPublicKey(key);
          const fingerprint = crypto.createHash('sha256').update(publicKey.export({type:'spki', format:'der'})).digest('hex');
          if (fingerprint !== '72375f41178c5a12c6fa702f1a1cd6c91c122997a617aa5127abf79bbfc5e259') throw Error('The signing secret does not match the key trusted by installed clients.');
          const data = Buffer.from('Naanora release signing self-test');
          const signature = crypto.sign('sha256', data, {key, padding:crypto.constants.RSA_PKCS1_PSS_PADDING, saltLength:32});
          if (!crypto.verify('sha256', data, {key:publicKey, padding:crypto.constants.RSA_PKCS1_PSS_PADDING, saltLength:32}, signature)) throw Error('Signature round trip failed.');
          console.log('PASS: RSA signing secret matches the client trust key and signs/verifies correctly.');
          NODE
